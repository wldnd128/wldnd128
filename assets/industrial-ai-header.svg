<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Jiung Choi — Smart Factory Engineer</title>
  <desc id="desc">A minimal industrial AI blueprint banner with a vision camera, production line, and flowing data signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#edf6ff"/>
      <stop offset="1" stop-color="#f5fbf8"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94a3b8" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e3a8a" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <path d="M0 244 C140 196 241 286 386 230 S620 190 745 225 1010 304 1200 194" fill="none" stroke="#60a5fa" stroke-opacity=".28" stroke-width="1.5"/>
  <path d="M0 258 C160 216 250 300 420 248 S660 210 790 248 1010 286 1200 224" fill="none" stroke="#14b8a6" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="7 8"/>

  <g fill="#0f172a">
    <text x="68" y="92" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="1">JIUNG CHOI</text>
    <text x="71" y="124" font-family="Courier New, monospace" font-size="15" letter-spacing="2.1" fill="#2563eb">SMART FACTORY ENGINEER</text>
    <text x="71" y="154" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">manufacturing data  →  computer vision  →  production impact</text>
  </g>
  <g transform="translate(71 181)">
    <rect width="128" height="27" rx="13.5" fill="#dbeafe"/>
    <text x="64" y="18.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">COMPUTER VISION</text>
    <rect x="139" width="107" height="27" rx="13.5" fill="#ccfbf1"/>
    <text x="192.5" y="18.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f766e">INDUSTRIAL AI</text>
    <rect x="257" width="113" height="27" rx="13.5" fill="#dcfce7"/>
    <text x="313.5" y="18.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#15803d">SMART FACTORY</text>
  </g>

  <g transform="translate(730 43)" filter="url(#shadow)">
    <rect x="0" y="39" width="158" height="119" rx="13" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="20" y="59" width="62" height="43" rx="7" fill="#0f172a"/>
    <circle cx="51" cy="80.5" r="13" fill="#38bdf8"/>
    <circle cx="51" cy="80.5" r="6" fill="#dbeafe"/>
    <path d="M82 70 L112 59 L112 102 L82 92 Z" fill="#1e3a8a"/>
    <path d="M35 113 H116" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M55 113 V136 M96 113 V136" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <text x="79" y="184" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#0f172a">VISION SENSOR</text>
  </g>

  <g transform="translate(941 54)">
    <text x="0" y="0" font-family="Courier New, monospace" font-size="15" font-weight="700" fill="#0f172a">AI QUALITY LOOP</text>
    <text x="0" y="22" font-family="Courier New, monospace" font-size="11" fill="#475569">detect / analyze / improve</text>
    <rect x="0" y="43" width="185" height="95" rx="15" fill="#ffffff" fill-opacity=".78" stroke="#cbd5e1"/>
    <path d="M20 95 H165" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <path d="M34 82 V108 M81 82 V108 M128 82 V108" stroke="#64748b" stroke-width="4"/>
    <circle cx="50" cy="74" r="10" fill="#2563eb"/>
    <circle cx="96" cy="74" r="10" fill="#06b6d4"/>
    <circle cx="142" cy="74" r="10" fill="#10b981"/>
    <path d="M50 59 C72 42 117 42 142 59" fill="none" stroke="url(#flow)" stroke-width="3" stroke-dasharray="5 7">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <path d="M817 159 C859 190 891 176 941 128" fill="none" stroke="url(#flow)" stroke-width="3" stroke-dasharray="5 8">
    <animate attributeName="stroke-dashoffset" values="0;-52" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <circle r="6" fill="#06b6d4">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M817 159 C859 190 891 176 941 128"/>
  </circle>
  <circle cx="683" cy="75" r="4" fill="#10b981"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1104" cy="182" r="4" fill="#2563eb"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#cbd5e1" stroke-opacity=".8"/>
</svg>
